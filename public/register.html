


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background: linear-gradient(135deg, #667eea, #764ba2);
  min-height:100vh;
}

.form-box{
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  border-radius:15px;
  color:white;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="form-box p-4">

        <h3 class="text-center mb-3">Student Registration</h3>
        <p class="text-center mb-4">Please fill the form carefully</p>

        <form id="registerForm">

          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" id="name" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Roll Number</label>
              <input type="text" id="roll" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" id="phone" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Confirm Password</label>
              <input type="password" id="confirm" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Gender</label>
              <select id="gender" class="form-select">
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Date of Birth</label>
              <input type="date" id="dob" class="form-control">
            </div>

            <div class="col-md-12">
              <label class="form-label">Address</label>
              <textarea id="address" class="form-control"></textarea>
            </div>

            <div class="col-md-12">
              <label class="form-label">Upload Photo</label>
              <input type="file" class="form-control">
            </div>

            <div class="col-12 mt-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label">
                  I agree to Terms & Conditions
                </label>
              </div>
            </div>

            <div class="col-12 text-center mt-4">
              <button type="submit" class="btn btn-warning px-5 fw-bold">
                Register
              </button>
            </div>

          </div>

        </form>

        <div class="text-center mt-3">
          <a href="login.html" class="text-warning">
            Already have account? Login
          </a>
        </div>

      </div>

    </div>

  </div>

</div>


<script>

const API = "http://localhost:3000";

document.getElementById("registerForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  // Get input values properly
  const pass = document.getElementById("password").value;
  const confirmPass = document.getElementById("confirm").value;
  const terms = document.getElementById("terms");

  if(pass !== confirmPass){
    alert("Passwords do not match!");
    return;
  }

  if(!terms.checked){
    alert("Accept Terms!");
    return;
  }

  fetch(API + "/register", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body: JSON.stringify({
      name: document.getElementById("name").value,
      roll: document.getElementById("roll").value,
      email: document.getElementById("email").value,
      password: pass
    })

  })
  .then(res => res.text())
  .then(msg => {

    alert(msg);

    if(msg.includes("Success")){
      location.href="login.html";
    }

  });

});
</script>

</body>
</html>
